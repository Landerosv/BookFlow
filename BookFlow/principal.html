<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookFlow · Principal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">

        <!-- Botón de menú (solo pantallas chicas) -->
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
            <i data-lucide="menu"></i>
        </button>

        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
 
        <!-- SideBar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <span class="icon">
                    <span class="cover-back"></span>
                    <span class="pages"></span>
                    <span class="cover-front"></span>
                </span>
                <span class="name">BookFlow</span>

                <button class="sidebar-close" id="sidebarClose" aria-label="Cerrar menú">
                    <i data-lucide="x"></i>
                </button>
            </div>
        
            <nav class="sidebar-nav">        
                <a class="nav-link active" data-vista="dashboard" href="#dashboard">
                    <i data-lucide="house" class="icon"></i>
                    Principal
                </a>
        
                <div class="nav-group">
                    <p>Usuarios</p>
                    <a class="nav-link" data-vista="lectores" href="#lectores">
                        <i data-lucide="users-round" class="icon"></i>
                        Lectores
                    </a>
                </div>
        
                <div class="nav-group">
                    <p>Catálogo</p>
                    <a class="nav-link" data-vista="libros" href="#libros">
                        <i data-lucide="book-open" class="icon"></i>
                        Libros
                    </a>

                    <a class="nav-link" data-vista="autores" href="#autores">
                        <i data-lucide="signature" class="icon"></i>
                        Autores
                    </a>

                    <a class="nav-link" data-vista="editoriales" href="#editoriales">
                        <i data-lucide="library" class="icon"></i>
                        Editoriales
                    </a>
                </div>
        
                <div class="nav-group">
                    <p>Préstamos</p>
                    <a class="nav-link" data-vista="prestamos" href="#prestamos">
                        <i data-lucide="credit-card" class="icon"></i>
                        Préstamos
                    </a>
                    
                    <a class="nav-link" data-vista="multas" href="#multas">
                        <i data-lucide="clock-alert" class="icon"></i>
                        Multas
                    </a>
                </div>
        
                <div class="nav-group">
                    <p>Personal</p>
                    <a class="nav-link" data-vista="administradores" href="#administradores">
                        <i data-lucide="shield-user" class="icon"></i>
                        Administradores
                    </a>

                    <a class="nav-link" data-vista="bibliotecarios" href="#bibliotecarios">
                        <i data-lucide="stamp" class="icon"></i>
                        Bibliotecarios
                    </a>
                </div>        
            </nav>
        
            <div class="lomo">
                <span class="line line-0"></span>
                <span class="line line-1"></span>
                <span class="line line-2"></span>
                <span class="line line-3"></span>
                <span class="line line-2"></span>
                <span class="line line-1"></span>
                <span class="line line-0"></span>
            </div>
        </aside>
    
        <!-- Main -->
        <main class="main">  
            <!-- Barra encabezado --> 
            <header class="topbar">
                <div class="tb-left">
                    <h1 id="tb-header">Hola, Luis - Biblioteca Principal</h1> 
                    <span class="date" id="fecha">Miércoles, 22 de julio 2026</span> <!--Esto con la fecha del día-->
                </div>

                <div class="tb-right">
                    <p>
                        <span class="tb-name" id="nombre">Luis Landeros</span>
                        <span class="tb-rol">Administrador</span>
                    </p>       
                    <div class="avatar">
                        <a href="#" class="nav-link">
                            <i data-lucide="user-round"></i>
                        </a>
                    </div>
                </div>
        
                <label class="buscar">
                    <i data-lucide="search"></i>
                    <input type="text"  id="buscador" placeholder="Buscar libro, lector o autor...">
                    <div id="resultados" class="resultados-dropdown"></div>
                </label>            
            </header>

            <div id="contenido"></div>

        </main>
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/principal.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/lectores.js"></script>
    <script src="js/libros.js"></script>
    <script src="js/autores.js"></script>
    <script src="js/editoriales.js"></script>
    <script src="js/prestamos.js"></script>
    <script src="js/multas.js"></script>
    <script src="js/administradores.js"></script>
    <script src="js/bibliotecarios.js"></script>
</body>
</html>
