<section class="panel panel-form">
    <div class="panel-header">
        <h2>Realizar o Actualizar Préstamo</h2>
        <div class="panel-actions">
            <button type="button" id="cancelar-edicion-prestamo" class="btn-secondary" disabled>Cancelar edición</button>
            <button type="submit" form="form-prestamo" class="btn-primary">
                <i data-lucide="save"></i>
                Guardar
            </button>
        </div>
    </div>

    <!-- contenedor msj error -->
    <div id="contenedor-alerta" class="alerta-error" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icono-error">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="estado-mensaje-prestamo"></span>
    </div>

    <form id="form-prestamo" class="form-crud" autocomplete="off">
        <input type="hidden" id="prestamo-id" name="id">

        <div class="field field-usuario">
            <label for="usuario-id">ID Lector</label>
            <input type="text" id="usuario-id" name="usuario_id" required>
        </div>

        <div class="field field-isbn">
            <label for="libro-isbn">ISBN Libro</label>
            <input type="text" id="libro-isbn" name="libro_isbn" required>
        </div>


        <div class="field field-fecha-prestamo">
            <label for="fecha-prestamo">Fecha préstamo</label>
            <input type="date" id="fecha-prestamo" name="fecha_prestamo" required>
        </div>

        <div class="field field-fecha-devolucion">
            <label for="fecha-devolucion">Fecha devolución</label>
            <input type="date" id="fecha-devolucion" name="fecha_devolucion" required>
        </div>

        <div class="field field-estado">
            <label for="estado-devolucion">Estado de la devolución</label>
            <div class="select-wrapper">
                <select id="estado-devolucion" name="estado_devolucion" required>
                    <option value="Selecciona un estado">Selecciona un estado</option>
                    <option value="En curso">En curso</option>
                    <option value="Devuelto">Devuelto</option>
                </select>
                <i data-lucide="chevron-down" class="select-icon"></i>
            </div>
        </div>
    </form>
    <p id="estado-mensaje-prestamo"></p>
</section>
