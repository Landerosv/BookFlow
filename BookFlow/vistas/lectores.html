<section class="panel panel-form">
    <div class="panel-header">
        <h2>Agregar o Editar Lector</h2>
        <div class="panel-actions">
            <button type="button" id="cancelar-edicion-lector" class="btn-secondary" disabled>Cancelar edición</button>
            <button type="submit" form="form-lector" class="btn-primary">
                <i data-lucide="save"></i>
                Guardar
            </button>
        </div>
    </div>

    <form id="form-lector" class="form-crud" autocomplete="off">
        <input type="hidden" id="lector-id" name="id">

        <div class="field field-nombre">
            <label for="nombre-lector">Nombre</label>
            <input type="text" id="nombre-lector" name="nombre" required>
        </div>

        <div class="field field-telefono">
            <label for="telefono-lector">Teléfono</label>
            <input type="tel" id="telefono-lector" name="telefono" maxlength="10" required>
        </div>
    </form>

    <p id="estado-mensaje-lector"></p>
</section>

<section class="panel panel-loans">
    <div class="panel-header">
        <h2>Catálogo de Lectores</h2>
        <div class="select-wrapper">
            <select>
                <option value="">Ordenar por</option>
                <option value="id-asc">Id (Mayor a menor)</option>
                <option value="id-desc">Id (Menor a mayor)</option>
                <option value="nombre-asc">Nombre (Ascendente)</option>
                <option value="nombre-desc">Nombre (Descendente)</option>
            </select>
            <i data-lucide="chevron-down" class="select-icon"></i>
        </div>
    </div>

    <div class="table-scroll">
        <table class="table-prin">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th><!-- sin título: columna de acciones --></th>
                </tr>
            </thead>
            <tbody id="tabla-lectores-body">
                <tr class="skeleton-row">
