<!-- Formulario de registro / edición de libro -->
<section class="panel panel-form">
    <div class="panel-header">
        <h2>Agregar / Editar libro</h2>
        <div class="panel-actions">
            <button type="button" id="cancelar-edicion" class="btn-secondary" disabled>Cancelar edición</button>
            <button type="submit" form="form-libro" class="btn-primary">
                <i data-lucide="save"></i>
                Guardar
            </button>
        </div>
    </div>

    <form id="form-libro" class="form-libro p-libros" autocomplete="off">
        <div class="field field-isbn">
            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" name="isbn" maxlength="13" required>
        </div>

        <div class="field field-nombre">
            <label for="nombre-libro">Nombre</label>
            <input type="text" id="nombre-libro" name="nombre" required>
        </div>

        <!-- Combobox: reutiliza el estilo del input y de .resultados-dropdown
             (el mismo que usa el buscador del topbar). Solo se agrega
             .combo-field para posicionar el dropdown y .combo-item para
             cada opción. -->
        <div class="field combo-field field-autor">
            <label for="autor">Autor</label>
            <input type="text" id="autor" name="autor" class="combo-input" autocomplete="off">
            <i data-lucide="chevron-down" class="combo-icon"></i>
            <div class="resultados-dropdown" id="autor-dropdown"></div>
        </div>

        <div class="field combo-field field-genero">
            <label for="genero">Género</label>
            <input type="text" id="genero" name="genero" class="combo-input" autocomplete="off">
            <i data-lucide="chevron-down" class="combo-icon"></i>
            <div class="resultados-dropdown" id="genero-dropdown"></div>
        </div>

        <div class="field combo-field field-editorial">
            <label for="editorial">Editorial</label>
            <input type="text" id="editorial" name="editorial" class="combo-input" autocomplete="off">
            <i data-lucide="chevron-down" class="combo-icon"></i>
            <div class="resultados-dropdown" id="editorial-dropdown"></div>
        </div>

        <div class="field field-stock">
            <label for="stock">Stock</label>
            <input type="number" id="stock" name="stock" min="0" value="0">
        </div>
    </form>

    <p id="estado-mensaje"></p>
</section>

<!-- Catálogo de libros -->
<section class="panel panel-loans">
    <div class="panel-header">
        <h2>Catálogo de libros</h2>
    </div>

    <div class="table-scroll">
        <table class="table-prin">
            <thead>
                <tr>
                    <th>ISBN</th>
                    <th>Nombre</th>
                    <th>Autor</th>
                    <th>Género</th>
                    <th>Editorial</th>
                    <th>Stock</th>
                    <th><!-- sin título: columna de acciones --></th>
                </tr>
            </thead>
            <tbody id="tabla-libros-body">
                <!-- filas generadas por JS -->
            </tbody>
        </table>
    </div>
</section>
