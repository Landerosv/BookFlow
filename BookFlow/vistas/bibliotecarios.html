<!-- Formulario de registro / edición de libro -->
<section class="panel panel-form">
    <div class="panel-header">
        <h2>Agregar o Editar Bibliotecario</h2>
        <div class="panel-actions">
            <button type="button" class="btn-secondary" disabled>Cancelar edición</button>
            <button type="submit" form="form-crud" class="btn-primary">
                <i data-lucide="save"></i>
                Guardar
            </button>
        </div>
    </div>

    <!-- contenedor msj error -->
    <div id="contenedor-alerta-bibliotecario" class="alerta-error" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icono-error">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="estado-mensaje-bibliotecario"></span>
    </div>

    <form id="form-crud" class="form-crud" autocomplete="off">
        <div class="field">
            <label>Nombre</label>
            <input type="text" id="bib-nombre" required>
        </div>

        <div class="field">
            <label>Usuario</label>
            <input type="text" id="bib-usuario" required>
        </div>

        <div class="field">
            <label>Correo</label>
            <input type="text" id="bib-correo" required>
        </div>

        <div class="field">
            <label>Contraseña</label>
            <input type="password" id="bib-password" required>
        </div>

        <div class="field">
            <label>Teléfono</label>
            <input type="text" id="bib-telefono">
        </div>
    </form>

    <p id="estado-mensaje"></p>
</section>

<!-- Catálogo de bibliotecarios -->
<section class="panel panel-loans">
    <div class="panel-header">
        <h2>Catálogo de Bibliotecarios</h2>
        <div class="select-wrapper">

                <option value="nombre-asc">Nombre (Ascendente)</option>
                <option value="nombre-desc">Nombre (Descendente)</option>
                <option value="usuario-asc">Usuario (Ascendente)</option>
                <option value="usuario-desc">Usuario (Descendente)</option>
            </select>
            <i data-lucide="chevron-down" class="select-icon"></i>

    <div class="table-scroll">
