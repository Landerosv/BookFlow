<!-- Formulario de registro / edición de libro -->
<section class="panel panel-form">
    <div class="panel-header">
        <h2>Agregar o Editar Bibliotecario</h2>
        <div class="panel-actions">
            <button type="button" class="btn-secondary" disabled>Cancelar edición</button>
            <button type="submit" form="form-crud" class="btn-primary">
                <i data-lucide="save"></i>
                Guardar
            </button>
        </div>
    </div>

    <form class="form-crud" autocomplete="off">
        <div class="field">
            <label>Nombre</label>
            <input type="text" required>
        </div>

        <div class="field">
            <label>Usuario</label>
            <input type="text">
        </div>

        <div class="field">
            <label>Correo</label>
            <input type="text">
        </div>

        <div class="field">
            <label>Teléfono</label>
            <input type="text">
        </div>
    </form>

    <p id="estado-mensaje"></p>
</section>

<!-- Catálogo de bibliotecarios -->
<section class="panel panel-loans">
    <div class="panel-header">
        <h2>Catálogo de Bibliotecarios</h2>
        <div class="select-wrapper">
            <select>
                <option value="">Ordenar por</option>
                <option value="nombre-asc">Nombre (Ascendente)</option>
                <option value="nombre-desc">Nombre (Descendente)</option>
                <option value="usuario-asc">Usuario (Ascendente)</option>
                <option value="usuario-desc">Usuario (Descendente)</option>
            </select>
            <i data-lucide="chevron-down" class="select-icon"></i>
        </div>
    </div>

    <div class="table-scroll">
        <table class="table-prin">
            <thead>

                    <th>Nombre</th>
