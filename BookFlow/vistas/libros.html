    <!-- Formulario de alta / edición de libro -->
    <!-- Clases .panel-form, .form-libro, .field, .btn-primary y .acciones-cell
            (esta última se agrega por JS en cada fila) están definidas en
            css/libros.css, que reutiliza las variables de css/styles.css. -->
    <section class="panel panel-form">
        <div class="panel-header">
            <h2>Agregar / Editar libro</h2>
        </div>

        <form id="form-libro" class="form-libro" autocomplete="off">
            <div class="field">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" maxlength="13" required>
            </div>

            <div class="field">
                <label for="nombre-libro">Nombre</label>
                <input type="text" id="nombre-libro" name="nombre" required>
            </div>

            <div class="field">
                <label for="autor">Autor</label>
                <input type="text" id="autor" name="autor">
            </div>

            <div class="field">
                <label for="genero">Género</label>
                <input type="text" id="genero" name="genero">
            </div>

            <div class="field">
                <label for="editorial">Editorial</label>
                <input type="text" id="editorial" name="editorial">
            </div>

            <div class="field">
                <label for="stock">Stock</label>
                <input type="number" id="stock" name="stock" min="0" value="0">
            </div>

            <div class="field field-actions">
                <button type="submit" class="btn-primary">Agregar</button>
            </div>
        </form>

        <p id="estado-mensaje"></p>
    </section>

    <!-- Catálogo de libros -->
    <section class="panel panel-loans">
        <div class="panel-header">
            <h2>Catálogo de libros</h2>
        </div>

        <div class="table-scroll">
            <table class="table-prin">
                <thead>
                    <tr>
                        <th>ISBN</th>
                        <th>Nombre</th>
                        <th>Autor</th>
                        <th>Género</th>
                        <th>Editorial</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-libros-body">
                    <!-- filas generadas por JS -->
                </tbody>
            </table>
        </div>
    </section>
