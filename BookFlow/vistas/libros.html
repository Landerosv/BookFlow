<!-- Formulario de registro / edición de libro -->
<section class="panel panel-form">
    <div class="panel-header">
        <h2>Agregar o Editar Libro</h2>
        <div class="panel-actions">
            <button type="button" id="cancelar-edicion" class="btn-secondary" disabled>Cancelar edición</button>
            <button type="submit" form="form-libro" class="btn-primary">
                <i data-lucide="save"></i>
                Guardar
            </button>
        </div>
    </div>

    <form id="form-libro" class="form-crud" autocomplete="off">
        <div class="field field-isbn">
            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" name="isbn" maxlength="13" required>
        </div>

        <div class="field field-nombre">
            <label for="nombre-libro">Nombre</label>
            <input type="text" id="nombre-libro" name="nombre" maxlength="150" required>
        </div>

        <div class="field field-autor">
            <label for="autor">Autor</label>

            <div class="select-wrapper">
                <select id="autor" name="autor" required>
                    <option value="">Selecciona un autor</option>
                </select>
                <i data-lucide="chevron-down" class="select-icon"></i>
            </div>
        </div>

        <div class="field field-genero">
            <label for="genero">Género</label>

            <div class="select-wrapper">
                <select id="genero" name="genero" required>
                    <option value="">Selecciona un género</option>
                    <option value="Novela">Novela</option>
                    <option value="Ciencia ficción">Ciencia ficción</option>
                    <option value="Romance">Romance</option>
                    <option value="Terror">Terror</option>
                    <option value="Historia">Historia</option>
                    <option value="Fantasía">Fantasía</option>
                    <option value="Drama">Drama</option>
                    <option value="Infantil">Infantil</option>
                </select>
                <i data-lucide="chevron-down" class="select-icon"></i>
            </div>
        </div>

        <div class="field field-editorial">
            <label for="editorial">Editorial</label>

            <div class="select-wrapper">
                <select id="editorial" name="editorial" required>
                    <option value="">Selecciona una editorial</option>
                </select>
                <i data-lucide="chevron-down" class="select-icon"></i>
            </div>
        </div>

        <div class="field field-stock">
            <label for="stock">Stock</label>
            <input type="number" id="stock" name="stock" min="0" value="0">
        </div>
    </form>

    <p id="estado-mensaje"></p>
</section>
